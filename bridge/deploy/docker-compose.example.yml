# Example only: placeholder names. Standalone mode (recommended): the bridge is its own container with its
# own Reticulum instance. It reaches MeshChatX over a shared Docker network:
#   - RNS:  TCPClientInterface -> meshchatx:4242 (MeshChatX's Reticulum needs a TCPServerInterface there)
#   - HTTP: http://meshchatx:8000 (set meshchatx.base_url in bridge.toml)
# A MeshChatX restart or recreate (image auto-update) only causes a short reconnect: RNS reconnects the TCP
# interface by itself, the HTTP client logs in again, the bridge re-announces. No watchdog, no recreate needed.
# Nothing here is deployed automatically.
services:
  kestrel-bridge:
    image: ghcr.io/ostapyrih/kestrel-bridge:latest   # pin a version tag in production
    restart: unless-stopped
    user: "10001:10001"
    read_only: true
    tmpfs:
      - /tmp
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    networks:
      - meshchatx-net
    volumes:
      # bridge.toml (whitelist of phone public keys, MeshChatX URL, [rns] settings, limits): read-only
      - ./kestrel/config/bridge.toml:/sidecar/config/bridge.toml:ro
      # the MeshChatX web password (file, mode 600, owner uid 10001): read-only
      - ./kestrel/secrets/meshchatx_password:/run/secrets/meshchatx_password:ro
      # optional, only if the MeshChatX TCP interface uses an IFAC passphrase (rns.ifac_passphrase_file):
      # - ./kestrel/secrets/ifac_passphrase:/run/secrets/ifac_passphrase:ro
      # RNS config dir: the bridge writes `config` here at every start (standalone). Own dir, never MeshChatX's.
      - ./kestrel/reticulum:/sidecar/.reticulum
      # sidecar identity S, LXMF router state, sqlite state (cursors, cmd_id journal): persistent
      - ./kestrel/storage:/sidecar/storage
      - ./kestrel/state:/sidecar/state
    healthcheck:
      # exit 0 = alive (also while "degraded": MeshChatX or the RNS interface down, so Docker does not flap);
      # exit 1 = no fresh heartbeat. Add --strict to get exit 3 for "degraded".
      test: ["CMD", "python", "-m", "kestrel_bridge", "--healthcheck"]
      interval: 30s
      timeout: 10s
      start_period: 60s
      retries: 3

networks:
  meshchatx-net:
    # Use YOUR MeshChatX network: the existing Docker network the MeshChatX container is attached to
    # (`docker inspect meshchatx` -> Networks). The container name/alias there must match
    # rns.tcp_host and the host in meshchatx.base_url (here: `meshchatx`).
    external: true
