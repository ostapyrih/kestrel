[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "kestrel-bridge"
version = "0.1.0"
description = "Kestrel bridge sidecar for MeshChatX"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    "rns",
    "lxmf",
]

[tool.setuptools]
packages = ["kestrel_bridge"]
