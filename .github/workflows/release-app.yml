name: release-app

on:
  push:
    tags: ["app-v*"]
  workflow_call:
    inputs:
      tag:
        description: "Release tag (e.g. app-v0.1.0)"
        required: true
        type: string
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag (e.g. app-v0.1.0)"
        required: true
        type: string

permissions:
  contents: write

env:
  TAG: ${{ inputs.tag || github.ref_name }}

jobs:
  android:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref_name }}
      - name: Compute version
        run: echo "VERSION=${TAG#app-v}" >> "$GITHUB_ENV"
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Decode keystore
        id: sign
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_B64 }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 -d > android/app/release.keystore
            {
              echo "storeFile=release.keystore"
              echo "storePassword=$KEYSTORE_PASSWORD"
              echo "keyAlias=$KEY_ALIAS"
              echo "keyPassword=$KEY_PASSWORD"
            } > android/key.properties
            echo "suffix=" >> "$GITHUB_OUTPUT"
          else
            echo "No signing secrets: building with debug signing"
            echo "suffix=-unsigned" >> "$GITHUB_OUTPUT"
          fi
      - run: flutter pub get
      - run: flutter build apk --release --split-per-abi
      - run: flutter build appbundle --release
      - name: Rename artifacts
        env:
          SUFFIX: ${{ steps.sign.outputs.suffix }}
        run: |
          mkdir -p ../dist
          for abi in arm64-v8a armeabi-v7a x86_64; do
            cp "build/app/outputs/flutter-apk/app-${abi}-release.apk" "../dist/kestrel-${VERSION}-${abi}${SUFFIX}.apk"
          done
          cp build/app/outputs/bundle/release/app-release.aab "../dist/kestrel-${VERSION}${SUFFIX}.aab"
      - uses: actions/upload-artifact@v4
        with:
          name: android
          path: dist/*

  ios:
    runs-on: macos-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref_name }}
      - name: Compute version
        run: echo "VERSION=${TAG#app-v}" >> "$GITHUB_ENV"
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter build ios --release --no-codesign
      - name: Package IPA
        run: |
          mkdir -p ../dist Payload
          cp -R build/ios/iphoneos/Runner.app Payload/
          zip -qry "../dist/kestrel-${VERSION}-unsigned.ipa" Payload
      - uses: actions/upload-artifact@v4
        with:
          name: ios
          path: dist/*

  publish:
    needs: [android, ios]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Checksums
        working-directory: dist
        run: sha256sum kestrel-* > SHA256SUMS.txt
      - name: Upload assets and append install notes
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          cat > install-notes.md <<'NOTES'
          ### Як встановити IPA

          IPA непідписаний (`kestrel-*-unsigned.ipa`), тому встановлюється тільки через sideload зі своїм Apple ID:

          1. Завантажте `kestrel-*-unsigned.ipa` з цього релізу.
          2. Встановіть через AltStore, SideStore або Sideloadly: вони підписують IPA вашим Apple ID.
          3. З безкоштовним Apple ID підпис діє 7 днів, після чого додаток потрібно переписати підписом (AltStore/SideStore можуть робити це автоматично).
          NOTES
          if ! gh release view "$TAG" >/dev/null 2>&1; then
            gh release create "$TAG" --title "$TAG" --notes ""
          fi
          gh release upload "$TAG" dist/* --clobber
          body="$(gh release view "$TAG" --json body --jq .body)"
          if ! printf '%s' "$body" | grep -q '### Як встановити IPA'; then
            { printf '%s\n\n' "$body"; cat install-notes.md; } > full-notes.md
            gh release edit "$TAG" --notes-file full-notes.md
          fi
