name: release-app

on:
  push:
    tags: ["app-v*"]
  workflow_call:
    inputs:
      tag:
        description: "Release tag (e.g. app-v0.1.0)"
        required: true
        type: string
      dry_run:
        description: "Build everything but skip release upload and notes (checks the jobs)"
        required: false
        type: boolean
        default: false
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag (e.g. app-v0.1.0)"
        required: true
        type: string
      dry_run:
        description: "Build everything but skip release upload and notes (checks the jobs)"
        required: false
        type: boolean
        default: false

permissions:
  contents: write

env:
  TAG: ${{ inputs.tag || github.ref_name }}
  # SHA-256 of the Android release signing certificate (public); signed builds must match it.
  EXPECTED_CERT_SHA256: "99:74:09:CA:9C:93:87:F6:7E:29:24:19:14:21:60:31:2B:AA:0F:63:CA:76:56:94:AF:85:50:D9:8E:40:04:C2"
  # A dry run builds the dispatched ref (e.g. a feature branch), a real run the tag.
  SRC_REF: ${{ inputs.dry_run && github.ref || inputs.tag || github.ref_name }}

jobs:
  android:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.SRC_REF }}
      - name: Compute version
        run: echo "VERSION=${TAG#app-v}" >> "$GITHUB_ENV"
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Decode keystore
        id: sign
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_B64 }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 -d > android/app/release.p12
            {
              echo "storeFile=release.p12"
              echo "storeType=pkcs12"
              echo "storePassword=$KEYSTORE_PASSWORD"
              echo "keyAlias=$KEY_ALIAS"
              echo "keyPassword=$KEY_PASSWORD"
            } > android/key.properties
            echo "suffix=" >> "$GITHUB_OUTPUT"
          else
            echo "No signing secrets: building with debug signing"
            echo "suffix=-unsigned" >> "$GITHUB_OUTPUT"
          fi
      - run: flutter pub get
      - run: flutter build apk --release --split-per-abi
      - run: flutter build appbundle --release
      - name: Verify the signing certificate
        if: ${{ steps.sign.outputs.suffix == '' }}
        run: |
          set -euo pipefail
          expected="$(printf '%s' "$EXPECTED_CERT_SHA256" | tr -d ':' | tr 'A-F' 'a-f')"
          apksigner="$(ls -d "$ANDROID_HOME"/build-tools/*/apksigner | sort -V | tail -n 1)"
          echo "Using $apksigner"
          for apk in build/app/outputs/flutter-apk/app-*-release.apk; do
            out="$("$apksigner" verify --print-certs "$apk")"
            actual="$(printf '%s\n' "$out" | sed -n 's/^Signer #1 certificate SHA-256 digest: //p' | tr 'A-F' 'a-f')"
            if [ "$actual" != "$expected" ]; then
              echo "::error::$apk is signed with an unexpected certificate (SHA-256 $actual)"
              exit 1
            fi
            echo "OK $apk: $actual"
          done
          # The AAB is a jar signed with jarsigner.
          aab_out="$(keytool -printcert -jarfile build/app/outputs/bundle/release/app-release.aab)"
          aab_actual="$(printf '%s\n' "$aab_out" | sed -n 's/^ *SHA256: //p' | head -n 1 | tr -d ':' | tr 'A-F' 'a-f')"
          if [ "$aab_actual" != "$expected" ]; then
            echo "::error::app-release.aab is signed with an unexpected certificate (SHA-256 $aab_actual)"
            exit 1
          fi
          echo "OK app-release.aab: $aab_actual"
      - name: Rename artifacts
        env:
          SUFFIX: ${{ steps.sign.outputs.suffix }}
        run: |
          mkdir -p ../dist
          for abi in arm64-v8a armeabi-v7a x86_64; do
            cp "build/app/outputs/flutter-apk/app-${abi}-release.apk" "../dist/kestrel-${VERSION}-${abi}${SUFFIX}.apk"
          done
          cp build/app/outputs/bundle/release/app-release.aab "../dist/kestrel-${VERSION}${SUFFIX}.aab"
      - uses: actions/upload-artifact@v4
        with:
          name: app-android
          path: dist/kestrel-*
          if-no-files-found: error
          # Already-compressed packages: skip re-compression.
          compression-level: 0

  ios:
    runs-on: macos-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.SRC_REF }}
      - name: Compute version
        run: echo "VERSION=${TAG#app-v}" >> "$GITHUB_ENV"
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter build ios --release --no-codesign
      - name: Package IPA
        run: |
          mkdir -p ../dist Payload
          cp -R build/ios/iphoneos/Runner.app Payload/
          zip -qry "../dist/kestrel-${VERSION}-unsigned.ipa" Payload
      - uses: actions/upload-artifact@v4
        with:
          name: app-ios
          path: dist/kestrel-*
          if-no-files-found: error
          # Already-compressed packages: skip re-compression.
          compression-level: 0

  windows:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.SRC_REF }}
      - name: Compute version
        shell: bash
        run: echo "VERSION=${TAG#app-v}" >> "$GITHUB_ENV"
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter build windows --release
      - name: Package zip
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force ../dist | Out-Null
          $name = "kestrel-$env:VERSION-windows-x64"
          Copy-Item build/windows/x64/runner/Release $name -Recurse
          Compress-Archive -Path $name -DestinationPath "../dist/$name.zip"
      - name: Build Inno Setup installer
        shell: pwsh
        run: |
          if (-not (Get-Command iscc -ErrorAction SilentlyContinue) -and
              -not (Test-Path "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe")) {
            choco install innosetup -y --no-progress
          }
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          & $iscc "/DAppVersion=$env:VERSION" `
            "/DSourceDir=$((Resolve-Path build/windows/x64/runner/Release).Path)" `
            "/DOutDir=$((Resolve-Path ../dist).Path)" `
            windows/installer/kestrel.iss
          if ($LASTEXITCODE -ne 0) { throw "ISCC failed" }
          Get-ChildItem ../dist
      - uses: actions/upload-artifact@v4
        with:
          name: app-windows
          path: dist/kestrel-*
          if-no-files-found: error
          # Already-compressed packages: skip re-compression.
          compression-level: 0

  macos:
    runs-on: macos-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.SRC_REF }}
      - name: Compute version
        run: echo "VERSION=${TAG#app-v}" >> "$GITHUB_ENV"
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter build macos --release
      - name: Package unsigned DMG
        run: |
          mkdir -p ../dist dmg-root
          app="$(ls -d build/macos/Build/Products/Release/*.app | head -n 1)"
          cp -R "$app" dmg-root/
          ln -s /Applications dmg-root/Applications
          hdiutil create -volname "Kestrel" -srcfolder dmg-root -ov -format UDZO \
            "../dist/kestrel-${VERSION}-macos.dmg"
      - uses: actions/upload-artifact@v4
        with:
          name: app-macos
          path: dist/kestrel-*
          if-no-files-found: error
          # Already-compressed packages: skip re-compression.
          compression-level: 0

  linux:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.SRC_REF }}
      - name: Compute version
        run: echo "VERSION=${TAG#app-v}" >> "$GITHUB_ENV"
      - name: Install Linux desktop build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev libsecret-1-dev liblzma-dev
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter build linux --release
      - name: Package tar.gz
        run: |
          mkdir -p ../dist
          name="kestrel-${VERSION}-linux-x64"
          rm -rf "$name"
          cp -R build/linux/x64/release/bundle "$name"
          tar -czf "../dist/${name}.tar.gz" "$name"
      - name: Package AppImage
        env:
          # appimagetool 1.9.1; digest as published by GitHub for the release asset.
          AIT_SHA256: ed4ce84f0d9caff66f50bcca6ff6f35aae54ce8135408b3fa33abfc3cb384eb0
        run: |
          curl -fsSL -o "$RUNNER_TEMP/appimagetool" \
            https://github.com/AppImage/appimagetool/releases/download/1.9.1/appimagetool-x86_64.AppImage
          echo "$AIT_SHA256  $RUNNER_TEMP/appimagetool" | sha256sum -c -
          chmod +x "$RUNNER_TEMP/appimagetool"
          rm -rf AppDir
          mkdir -p AppDir/usr/bin
          cp -R build/linux/x64/release/bundle/. AppDir/usr/bin/
          cat > AppDir/AppRun <<'APPRUN'
          #!/bin/sh
          HERE="$(dirname "$(readlink -f "$0")")"
          exec "$HERE/usr/bin/kestrel" "$@"
          APPRUN
          chmod +x AppDir/AppRun
          cat > AppDir/kestrel.desktop <<'DESKTOP'
          [Desktop Entry]
          Type=Application
          Name=Kestrel
          Comment=Reticulum / LXMF messenger
          Exec=kestrel
          Icon=kestrel
          Categories=Network;InstantMessaging;
          Terminal=false
          DESKTOP
          cp ../assets/icon/kestrel-512.png AppDir/kestrel.png
          ARCH=x86_64 "$RUNNER_TEMP/appimagetool" --appimage-extract-and-run AppDir \
            "../dist/kestrel-${VERSION}-linux-x86_64.AppImage"
      - uses: actions/upload-artifact@v4
        with:
          name: app-linux
          path: dist/kestrel-*
          if-no-files-found: error
          # Already-compressed packages: skip re-compression.
          compression-level: 0

  publish:
    needs: [android, ios, windows, macos, linux]
    runs-on: ubuntu-latest
    steps:
      # tools/release/sign.py comes from the same ref the artifacts were built from.
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.SRC_REF }}
          sparse-checkout: tools/release
      # Only the app-* artifacts: a workflow_call shares its run with the caller
      # (release-please), whose unrelated artifacts (e.g. *.dockerbuild records)
      # break an unfiltered download.
      - uses: actions/download-artifact@v4
        with:
          pattern: app-*
          path: dist
          merge-multiple: true
      - name: List dist
        run: ls -la dist
      - name: Checksums
        working-directory: dist
        run: sha256sum kestrel-* > SHA256SUMS.txt
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Sign checksums (Ed25519)
        env:
          RELEASE_SIGNING_KEY: ${{ secrets.RELEASE_SIGNING_KEY }}
        run: |
          pip install cryptography==50.0.2
          if [ -z "$RELEASE_SIGNING_KEY" ]; then
            echo "::error::RELEASE_SIGNING_KEY is not set; refusing to publish an unsigned release"
            exit 1
          fi
          python tools/release/sign.py dist/SHA256SUMS.txt
          python tools/release/verify.py dist/SHA256SUMS.txt dist/SHA256SUMS.txt.sig --check-files dist
      - name: Keep checksums of a dry run
        if: ${{ inputs.dry_run }}
        uses: actions/upload-artifact@v4
        with:
          name: checksums
          path: |
            dist/SHA256SUMS.txt
            dist/SHA256SUMS.txt.sig
      - name: Upload assets and append install notes
        if: ${{ !inputs.dry_run }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          cat > install-notes.md <<'NOTES'
          ### How to install the IPA

          The IPA is unsigned (`kestrel-*-unsigned.ipa`), so it can only be installed by sideloading with your own Apple ID:

          1. Download `kestrel-*-unsigned.ipa` from this release.
          2. Install it with Sideloadly, AltStore or SideStore; they sign the IPA with your Apple ID.
          3. On iOS 16 and later, enable Developer Mode (Settings > Privacy & Security > Developer Mode).
          4. Free Apple ID signatures expire after 7 days, after which the app must be re-signed (AltStore/SideStore can refresh it automatically).
          NOTES
          cat > desktop-notes.md <<'NOTES'
          ### Desktop install

          The desktop builds are not code-signed, so each system shows a warning on first launch. Release integrity is verified with `SHA256SUMS.txt` and its Ed25519 signature `SHA256SUMS.txt.sig` (see the README); the desktop app checks both before it installs an update.

          - **Windows** (`kestrel-*-windows-x64-setup.exe`): run the installer; it installs per user (no admin rights) to `%LOCALAPPDATA%\Programs\Kestrel`. SmartScreen warns about an unknown publisher: click *More info*, then *Run anyway*. The portable `kestrel-*-windows-x64.zip` is also provided.
          - **macOS** (`kestrel-*-macos.dmg`): open the DMG and drag Kestrel to Applications. On first launch use right-click, then *Open*, or run `xattr -dr com.apple.quarantine /Applications/Kestrel.app` in a terminal.
          - **Linux** (`kestrel-*-linux-x86_64.AppImage` or `kestrel-*-linux-x64.tar.gz`): `chmod +x` the AppImage and run it. Kestrel keeps its identity key in the system keyring, so it needs libsecret and a running Secret Service (GNOME Keyring or KWallet).
          NOTES
          if ! gh release view "$TAG" >/dev/null 2>&1; then
            gh release create "$TAG" --title "$TAG" --notes ""
          fi
          gh release upload "$TAG" dist/* --clobber
          body="$(gh release view "$TAG" --json body --jq .body)"
          if ! printf '%s' "$body" | grep -q '### How to install the IPA'; then
            { printf '%s\n\n' "$body"; cat install-notes.md; } > full-notes.md
            gh release edit "$TAG" --notes-file full-notes.md
          fi
          body="$(gh release view "$TAG" --json body --jq .body)"
          if ! printf '%s' "$body" | grep -q '### Desktop install'; then
            { printf '%s\n\n' "$body"; cat desktop-notes.md; } > full-notes.md
            gh release edit "$TAG" --notes-file full-notes.md
          fi
