name: release-please

on:
  push:
    branches: [main]

permissions:
  contents: write
  pull-requests: write

jobs:
  release-please:
    runs-on: ubuntu-latest
    outputs:
      app_released: ${{ steps.rp.outputs['app--release_created'] }}
      app_tag: ${{ steps.rp.outputs['app--tag_name'] }}
      bridge_released: ${{ steps.rp.outputs['bridge--release_created'] }}
      bridge_tag: ${{ steps.rp.outputs['bridge--tag_name'] }}
    steps:
      - uses: googleapis/release-please-action@v4
        id: rp
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  # Tags created with GITHUB_TOKEN do not trigger push-tag workflows,
  # so the release builds are chained explicitly via workflow_call.
  release-app:
    needs: release-please
    if: needs.release-please.outputs.app_released == 'true'
    permissions:
      contents: write
    uses: ./.github/workflows/release-app.yml
    with:
      tag: ${{ needs.release-please.outputs.app_tag }}
    secrets: inherit

  # Refresh the AltStore / SideStore source on GitHub Pages once the IPA is uploaded.
  # deploy-pages cannot find its artifact when run as a reusable workflow inside this
  # run (it also holds release artifacts), so altstore.yml is dispatched as its own run.
  altstore:
    needs: [release-please, release-app]
    if: needs.release-please.outputs.app_released == 'true'
    runs-on: ubuntu-latest
    permissions:
      actions: write
      contents: read
    steps:
      - name: Dispatch the AltStore workflow
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: gh workflow run altstore.yml --ref main

  release-bridge:
    needs: release-please
    if: needs.release-please.outputs.bridge_released == 'true'
    permissions:
      contents: write
      packages: write
      id-token: write
      attestations: write
    uses: ./.github/workflows/release-bridge.yml
    with:
      tag: ${{ needs.release-please.outputs.bridge_tag }}
    secrets: inherit
