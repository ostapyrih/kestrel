name: release-bridge

on:
  push:
    tags: ["bridge-v*"]
  workflow_call:
    inputs:
      tag:
        description: "Release tag (e.g. bridge-v0.1.0)"
        required: true
        type: string
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag (e.g. bridge-v0.1.0)"
        required: true
        type: string

permissions:
  contents: write
  packages: write
  id-token: write
  attestations: write

env:
  TAG: ${{ inputs.tag || github.ref_name }}

jobs:
  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref_name }}
      - name: Compute version
        id: ver
        run: echo "version=${TAG#bridge-v}" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push
        id: build
        uses: docker/build-push-action@v6
        with:
          context: bridge
          platforms: linux/amd64,linux/arm64
          push: true
          sbom: true
          provenance: mode=max
          tags: |
            ghcr.io/ostapyrih/kestrel-bridge:${{ steps.ver.outputs.version }}
            ghcr.io/ostapyrih/kestrel-bridge:latest
      - name: Write release notes addendum
        run: |
          {
            echo "### Docker image"
            echo ""
            echo '```'
            echo "ghcr.io/ostapyrih/kestrel-bridge:${{ steps.ver.outputs.version }}"
            echo "digest: ${{ steps.build.outputs.digest }}"
            echo '```'
          } > image-notes.md
      - name: Append to release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          body="$(gh release view "$TAG" --json body --jq .body 2>/dev/null || true)"
          if gh release view "$TAG" >/dev/null 2>&1; then
            if ! printf '%s' "$body" | grep -q '### Docker image'; then
              { printf '%s\n\n' "$body"; cat image-notes.md; } > full-notes.md
              gh release edit "$TAG" --notes-file full-notes.md
            fi
          else
            gh release create "$TAG" --title "$TAG" --notes-file image-notes.md
          fi
