name: release-bridge

on:
  push:
    tags: ["bridge-v*"]

permissions:
  contents: write
  packages: write

jobs:
  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Compute version
        id: ver
        run: echo "version=${GITHUB_REF_NAME#bridge-v}" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push
        id: build
        uses: docker/build-push-action@v6
        with:
          context: bridge
          platforms: linux/amd64,linux/arm64
          push: true
          sbom: true
          provenance: mode=max
          tags: |
            ghcr.io/ostapyrih/kestrel-bridge:${{ steps.ver.outputs.version }}
            ghcr.io/ostapyrih/kestrel-bridge:latest
      - name: Write release notes addendum
        run: |
          {
            echo "### Docker image"
            echo ""
            echo '```'
            echo "ghcr.io/ostapyrih/kestrel-bridge:${{ steps.ver.outputs.version }}"
            echo "digest: ${{ steps.build.outputs.digest }}"
            echo '```'
          } > image-notes.md
      - name: Append to release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          body="$(gh release view "$GITHUB_REF_NAME" --json body --jq .body 2>/dev/null || true)"
          { printf '%s\n\n' "$body"; cat image-notes.md; } > full-notes.md
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release edit "$GITHUB_REF_NAME" --notes-file full-notes.md
          else
            gh release create "$GITHUB_REF_NAME" --title "$GITHUB_REF_NAME" --notes-file image-notes.md
          fi
