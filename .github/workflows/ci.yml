name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  app:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Python reference (RNS/LXMF) for the integration test
        working-directory: .
        run: |
          python -m venv tools/.venv
          tools/.venv/bin/pip install -r tools/requirements.txt
          # the bridge itself, for the Dart <-> kestrel-bridge integration test
          tools/.venv/bin/pip install -e bridge
      - run: flutter pub get
      - run: flutter analyze
      - name: Unit, widget and integration tests (NodeService vs Python LXMF)
        run: flutter test
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Build debug APK
        run: flutter build apk --debug
      - name: Install Linux desktop build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev libx11-dev libxi-dev libsecret-1-dev liblzma-dev
      - name: Build Linux desktop (debug)
        run: flutter build linux --debug

  app-windows:
    runs-on: windows-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Python reference (RNS/LXMF) for the integration test
        working-directory: .
        shell: bash
        run: |
          python -m venv tools/.venv
          tools/.venv/Scripts/pip install -r tools/requirements.txt
          tools/.venv/Scripts/pip install -e bridge
      - run: flutter pub get
      - name: Unit, widget and integration tests
        run: flutter test
      - name: Build Windows desktop (debug)
        run: flutter build windows --debug

  bridge:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
    defaults:
      run:
        working-directory: bridge
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: bridge/pyproject.toml
      - run: pip install -e ".[dev]"
      - run: python -m pyflakes kestrel_bridge tests
      - run: python -m unittest discover -s tests -t . -v

  bridge-integration:
    # Real Reticulum (shared instance + TCP) + fake MeshChatX + sidecar + a Python phone client.
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: bridge
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: bridge/pyproject.toml
      - run: pip install -e ".[dev]"
      - run: python -m unittest tests.test_integration_rns -v
        env:
          KESTREL_IT: "1"

  altstore-tools:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m unittest discover -s tools/altstore -v

  release-tools:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install cryptography==50.0.2
      - run: python -m unittest discover -s tools/release -v

  bridge-docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: bridge
          push: false

  kestrel_rns:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/kestrel_rns
    steps:
      - uses: actions/checkout@v4
      - uses: dart-lang/setup-dart@v1
        with:
          sdk: stable
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Python reference (RNS/LXMF)
        working-directory: .
        run: |
          python -m venv tools/.venv
          tools/.venv/bin/pip install -r tools/requirements.txt
      - run: dart pub get
      - run: dart analyze --fatal-infos
      - name: Regenerate golden vectors and fail on drift
        working-directory: .
        run: |
          tools/.venv/bin/python tools/gen_vectors.py
          git diff --exit-code -- packages/kestrel_rns/test/vectors
      - name: Unit and golden-vector tests
        run: dart test -x integration
      - name: Cross-check Dart output with Python reference
        run: dart test -t python
      - name: Integration tests (live Python RNS reference peer over loopback TCP)
        run: dart test -t integration
